# Air configuration file

[build]
  cmd = "go build -o ./.tmp/main cmd/app/main.go"
  bin = ".tmp/main"
  include_ext = ["go", "tpl", "tmpl", "html", ".env"] # file extensions to watch
  exclude_dir = ["assets", "tmp", "vendor"]    # directories to ignore

[log]
  time = true

[watcher]
  delay = 500
